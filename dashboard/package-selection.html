<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Redirecting to OfficeFlow Billing</title>
<link rel="stylesheet" href="/dashboard/css/mobile.css">
<link rel="stylesheet" href="/dashboard/css/executive-theme.css">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f6f8;color:#16213e;font-family:Inter,system-ui,sans-serif}.panel{max-width:460px;margin:24px;padding:32px;background:#fff;border:1px solid #e4e7ec;border-radius:16px;text-align:center}.mark{font-weight:800;letter-spacing:.02em;font-size:24px}.muted{color:#667085;line-height:1.6}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/dashboard/js/config.js"></script>
<script src="/dashboard/js/db.js"></script>
<script src="/dashboard/js/ooes-auth.js"></script>
</head>
<body>
<main class="panel">
<p class="mark">OfficeFlow</p>
<h1>Opening subscription billing</h1>
<p class="muted">We’ve moved subscription selection to the secure billing page. You’ll be redirected after your sign-in is checked.</p>
<p id="status" class="muted" role="status" aria-live="polite">Checking your session…</p>
<a id="continue" href="/dashboard/billing.html">Continue to billing</a>
</main>
<script>
(async function(){
 const status=document.getElementById('status');
 try{
  const valid=await OOES_AUTH.ready;
  if(valid && OOES_AUTH.getSession()){
   window.location.replace('/dashboard/billing.html');
  } else {
   status.textContent='Please sign in to continue. If you are not redirected, use the sign-in page.';
   document.getElementById('continue').href='/dashboard/auth.html';
  }
 }catch{
  status.textContent='We could not verify your session. Please sign in again.';
  document.getElementById('continue').href='/dashboard/auth.html';
 }
})();
</script>
</body>
</html>
