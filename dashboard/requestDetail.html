<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OfficeFlow — Request</title><script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/dashboard/js/config.js"></script>
<script>var supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);</script>
<link rel="stylesheet" href="css/executive-theme.css"><link rel="stylesheet" href="css/mobile.css">
</head><body class="bg-gray-50">
<header class="of-header px-6 py-4 flex justify-between items-center"><div><div class="of-eyebrow">OfficeFlow</div><h1 class="of-serif text-2xl font-semibold">Request</h1></div><a href="workflow.html" class="text-sm">Workflows</a></header>
<main class="max-w-4xl mx-auto p-6"><div id="error" class="hidden text-red-600 mb-4"></div><section id="card" class="of-card p-6"></section><section id="steps" class="of-card p-6 mt-6"></section></main>
<script src="/dashboard/js/ooes-auth.js"></script><script src="/dashboard/js/workflow-db.js"></script>
<script>
const id=new URLSearchParams(location.search).get('id');const $=x=>document.getElementById(x);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){if(!id){$('error').textContent='Missing request id.';$('error').classList.remove('hidden');return;}try{const r=await OfficeFlowWorkflow.request(id);const steps=await OfficeFlowWorkflow.steps(id);const defs=await OfficeFlowWorkflow.stepDefinitions(r.workflow_version_id);const names=Object.fromEntries(defs.map(x=>[x.id,x]));$('card').innerHTML='<div class="flex justify-between gap-4"><div><div class="text-xs uppercase tracking-wide text-gray-500">'+esc(r.priority)+'</div><h2 class="of-serif text-2xl font-semibold mt-1">'+esc(r.title)+'</h2><p class="text-sm text-gray-500 mt-2">Submitted '+new Date(r.created_at).toLocaleString()+'</p></div><span class="h-fit px-3 py-1 rounded-full bg-gray-100 text-sm">'+esc(r.status)+'</span></div><div class="mt-6"><h3 class="font-semibold mb-2">Details</h3><pre class="whitespace-pre-wrap text-sm bg-gray-50 rounded p-4">'+esc(r.payload?.details||'')+'</pre></div><div class="mt-4 text-xs text-gray-500">Request ID: '+esc(r.id)+'</div>';
$('steps').innerHTML='<h3 class="of-serif text-xl font-semibold mb-4">Approval steps</h3>'+steps.map(s=>{const d=names[s.workflow_step_id]||{};return '<div class="border rounded p-4 mb-3 flex flex-col md:flex-row md:items-center md:justify-between gap-3"><div><div class="font-medium">Step '+esc(s.step_order)+': '+esc(d.name||'Approval')+'</div><div class="text-xs text-gray-500">Approver role: '+esc(d.approver_role||'')+' · SLA: '+esc(d.sla_hours||'—')+' hours</div></div><div class="flex items-center gap-2"><span class="text-sm px-2 py-1 rounded bg-gray-100">'+esc(s.status)+'</span>'+(s.status==='pending'?'<button onclick="decide(\''+s.id+'\',\'approved\')" class="text-sm px-3 py-1 rounded text-white bg-green-700">Approve</button><button onclick="decide(\''+s.id+'\',\'rejected\')" class="text-sm px-3 py-1 rounded text-white bg-red-700">Reject</button>':'')+'</div></div>';}).join('')||'<p class="text-gray-500">No steps found.</p>';}catch(e){$('error').textContent=e.message;$('error').classList.remove('hidden');}}
async function decide(step,decision){const comment=prompt('Optional comment:')||null;try{await OfficeFlowWorkflow.decide(step,decision,comment);await load();}catch(e){$('error').textContent=e.message;$('error').classList.remove('hidden');}}
document.addEventListener('DOMContentLoaded',load);
</script></body></html>
