<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OfficeFlow — My Work</title>
<script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/dashboard/js/config.js"></script><script>var supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);</script>
<link rel="stylesheet" href="css/executive-theme.css"><link rel="stylesheet" href="css/mobile.css">
</head><body class="bg-gray-50">
<header class="of-header px-6 py-4 flex justify-between items-center"><div><div class="of-eyebrow">OfficeFlow</div><h1 class="of-serif text-2xl font-semibold">My Work</h1></div><a href="index.html" class="text-sm">Dashboard</a></header>
<main class="max-w-6xl mx-auto p-6">
<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
<div class="of-card p-4"><div class="text-xs text-gray-500">Pending</div><div id="pending" class="text-2xl font-semibold">—</div></div>
<div class="of-card p-4"><div class="text-xs text-gray-500">Overdue</div><div id="overdue" class="text-2xl font-semibold">—</div></div>
<div class="of-card p-4"><div class="text-xs text-gray-500">Escalated</div><div id="escalated" class="text-2xl font-semibold">—</div></div>
<div class="of-card p-4"><div class="text-xs text-gray-500">Role</div><div id="role" class="text-lg font-semibold">—</div></div>
</div>
<section class="of-card p-6"><div class="flex justify-between items-center mb-5"><div><h2 class="of-serif text-xl font-semibold">Approvals waiting for you</h2><p class="text-sm text-gray-500">Only work assigned to your current role and organization is shown.</p></div><button id="refresh" class="text-sm" style="color:var(--of-brass)">Refresh</button></div>
<div id="error" class="hidden text-red-600 mb-4"></div><div id="list" class="space-y-3"></div></section>
</main>
<script src="/dashboard/js/ooes-auth.js"></script><script src="/dashboard/js/workflow-db.js"></script>
<script>
const $=x=>document.getElementById(x); const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function dueLabel(d){if(!d)return 'No SLA';const t=new Date(d).getTime()-Date.now(),h=Math.round(Math.abs(t)/3600000);return t<0?'Overdue by '+h+'h':h<1?'Due soon':'Due in '+h+'h';}
async function load(){
 try{const s=OOES_AUTH.getSession();$('role').textContent=s?.role||'—';const {data,error}=await supabase.rpc('fn_my_work');if(error)throw error;const rows=data||[];$('pending').textContent=rows.length;$('overdue').textContent=rows.filter(x=>x.due_at&&new Date(x.due_at)<new Date()).length;$('escalated').textContent=rows.filter(x=>x.escalated_at).length;
 $('list').innerHTML=rows.length?rows.map(x=>'<div class="border rounded-lg p-4 flex flex-col md:flex-row md:items-center md:justify-between gap-4"><div><div class="font-semibold">'+esc(x.request_title)+'</div><div class="text-xs text-gray-500 mt-1">'+esc(x.step_name)+' · Step '+esc(x.step_order)+' · '+esc(x.approver_role)+' · '+esc(x.request_priority)+'</div><div class="text-xs mt-2 '+(x.due_at&&new Date(x.due_at)<new Date()?'text-red-600':'text-gray-500')+'">'+esc(dueLabel(x.due_at))+(x.escalated_at?' · Escalated':'')+'</div></div><div class="flex gap-2"><a href="requestDetail.html?id='+encodeURIComponent(x.request_id)+'" class="px-3 py-2 rounded border text-sm">Open</a><button onclick="act(\''+x.request_step_id+'\',\'approved\')" class="px-3 py-2 rounded text-sm text-white bg-green-700">Approve</button><button onclick="act(\''+x.request_step_id+'\',\'rejected\')" class="px-3 py-2 rounded text-sm text-white bg-red-700">Reject</button></div></div>').join(''):'<div class="text-center py-12 text-gray-500">You have no pending approvals. Your work queue is clear.</div>';
 }catch(e){$('error').textContent=e.message||'Unable to load My Work.';$('error').classList.remove('hidden');}}
async function act(id,decision){const comment=prompt('Optional comment:')||null;try{await OfficeFlowWorkflow.decide(id,decision,comment);await load();}catch(e){$('error').textContent=e.message||'Action failed.';$('error').classList.remove('hidden');}}
$('refresh').onclick=load;document.addEventListener('DOMContentLoaded',load);
</script></body></html>
