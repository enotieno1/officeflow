<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OfficeFlow - Reset Password</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/dashboard/js/config.js"></script>
<script>var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);</script>
<link rel="stylesheet" href="css/executive-theme.css">
<link rel="stylesheet" href="css/mobile.css">
</head>
<body class="min-h-screen flex items-center justify-center p-4" style="background:var(--of-navy)">
<main class="w-full max-w-md">
<div class="bg-white rounded-2xl p-8 shadow-2xl">
<div class="text-center mb-8">
<h1 class="of-serif text-3xl font-semibold text-gray-800">Reset Password</h1>
<p class="text-gray-600 mt-2">Choose a new password for your OfficeFlow account.</p>
</div>
<form id="resetForm">
<label for="password" class="block text-sm font-medium text-gray-700 mb-2">New password</label>
<input id="password" type="password" minlength="8" required class="w-full px-4 py-3 border border-gray-300 rounded-lg mb-4">
<label for="confirm" class="block text-sm font-medium text-gray-700 mb-2">Confirm password</label>
<input id="confirm" type="password" minlength="8" required class="w-full px-4 py-3 border border-gray-300 rounded-lg mb-6">
<button id="submitBtn" class="w-full py-3 rounded-lg text-white font-semibold" style="background:var(--of-navy)" type="submit">Update Password</button>
<p id="message" class="text-sm mt-4 text-center"></p>
</form>
<p class="text-center mt-6"><a href="/dashboard/auth.html" class="text-sm" style="color:var(--of-brass)">Return to sign in</a></p>
</div>
</main>
<script>
const form=document.getElementById('resetForm');
const msg=document.getElementById('message');
form.addEventListener('submit',async function(e){
 e.preventDefault();
 const password=document.getElementById('password').value;
 const confirm=document.getElementById('confirm').value;
 if(password!==confirm){msg.textContent='Passwords do not match.';msg.className='text-sm mt-4 text-center text-red-600';return;}
 const {error}=await supabase.auth.updateUser({password});
 if(error){msg.textContent=error.message;msg.className='text-sm mt-4 text-center text-red-600';return;}
 msg.textContent='Password updated successfully. Redirecting to sign in...';
 msg.className='text-sm mt-4 text-center text-green-600';
 await supabase.auth.signOut();
 setTimeout(()=>window.location.href='/dashboard/auth.html',1200);
});
</script>
</body>
</html>
