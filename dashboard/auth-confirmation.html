<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Confirm your OfficeFlow account</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/dashboard/js/config.js"></script>
  <style>
    :root{--navy:#18263d;--brass:#b69a5a;--ink:#243047;--muted:#667085;--paper:#f7f8fa}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--navy);font:16px/1.55 Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}
    main{width:min(100%,520px);background:white;border-top:4px solid var(--brass);border-radius:14px;padding:36px;box-shadow:0 24px 70px #0003}
    .brand{font:600 30px Georgia,serif;color:var(--navy);margin:0 0 8px}.rule{height:2px;width:64px;background:var(--brass);margin:16px 0 24px}
    h1{font-size:23px;margin:0 0 10px}p{color:var(--muted);margin:0 0 18px}.status{padding:14px;border-radius:8px;background:var(--paper);margin:20px 0}
    a,.button{display:inline-block;background:var(--navy);color:white;text-decoration:none;padding:12px 18px;border-radius:8px;font-weight:600;border:0;cursor:pointer}
    .hidden{display:none}.error{color:#9f2525;background:#fff2f0}.success{color:#17633b;background:#effaf3}
  </style>
</head>
<body>
<main>
  <p class="brand">OfficeFlow</p><div class="rule"></div>
  <h1 id="heading">Confirming your email address</h1>
  <p id="description">Please keep this page open while we securely verify your confirmation link.</p>
  <div id="status" class="status" role="status" aria-live="polite">Checking confirmation link…</div>
  <a id="login" class="hidden" href="/dashboard/auth.html">Continue to sign in</a>
  <button id="retry" class="button hidden" type="button" onclick="window.location.reload()">Try again</button>
</main>
<script>
(async function () {
  const status = document.getElementById('status');
  const heading = document.getElementById('heading');
  const description = document.getElementById('description');
  const login = document.getElementById('login');
  const retry = document.getElementById('retry');
  function showError(message) {
    heading.textContent = 'We could not confirm this link';
    description.textContent = 'Your account has not been confirmed by this attempt. You can request a fresh email from the sign-in page.';
    status.textContent = message || 'The link may have expired or already been used. Request a new confirmation email and try again.';
    status.className = 'status error'; retry.classList.remove('hidden'); login.classList.remove('hidden');
  }
  try {
    if (!window.supabase || !window.SUPABASE_URL || !window.SUPABASE_KEY) {
      throw new Error('OfficeFlow authentication configuration did not load. Please try again later.');
    }
    const client = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_KEY);
    const params = new URLSearchParams(window.location.search);
    const tokenHash = params.get('token_hash');
    const type = params.get('type');
    const authError = params.get('error_description') || params.get('error');
    if (authError) throw new Error(authError.replace(/\+/g, ' '));
    if (tokenHash && type) {
      const result = await client.auth.verifyOtp({ token_hash: tokenHash, type: type });
      if (result.error) throw result.error;
    } else {
      // Supabase JS detects and exchanges supported PKCE/code or hash callbacks.
      const { data, error } = await client.auth.getSession();
      if (error) throw error;
      if (!data || !data.session) {
        throw new Error('This confirmation link did not return a valid session. It may have expired or already been used.');
      }
    }
    heading.textContent = 'Email confirmed successfully';
    description.textContent = 'Your OfficeFlow account email has been verified.';
    status.textContent = 'Confirmation complete. Continue to OfficeFlow sign in to open your workspace.';
    status.className = 'status success';
    login.classList.remove('hidden');
    // Remove credentials and tokens from the visible URL before navigating.
    window.history.replaceState({}, document.title, window.location.pathname);
    login.href = '/dashboard/auth.html?confirmed=1';
  } catch (error) {
    showError(error && error.message);
  }
})();
</script>
</body>
</html>
