<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OfficeFlow — Work Center</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/dashboard/js/config.js"></script><script>var supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);</script>
<link rel="stylesheet" href="css/executive-theme.css"><link rel="stylesheet" href="css/mobile.css">
</head><body class="bg-gray-50">
<header class="of-header px-6 py-4 flex justify-between items-center"><div><div class="of-eyebrow">OfficeFlow</div><h1 class="of-serif text-2xl font-semibold">Work Center</h1><p class="text-sm text-gray-500 mt-1">Execute any repeatable office process from one place.</p></div><a href="/dashboard/index.html" class="text-sm">Dashboard</a></header>
<main class="max-w-6xl mx-auto p-6 grid lg:grid-cols-3 gap-6">
<section class="lg:col-span-1 of-card p-6">
<h2 class="of-serif text-xl font-semibold mb-1">Start work</h2><p class="text-sm text-gray-500 mb-5">Choose a service or organizational process.</p>
<label class="block text-sm font-medium mb-1">Workflow</label><select id="workflow" class="w-full border rounded px-3 py-2 mb-4"></select>
<label class="block text-sm font-medium mb-1">Title</label><input id="title" maxlength="200" class="w-full border rounded px-3 py-2 mb-4" placeholder="e.g. Annual leave request">
<label class="block text-sm font-medium mb-1">Priority</label><select id="priority" class="w-full border rounded px-3 py-2 mb-4"><option>low</option><option selected>normal</option><option>high</option><option>urgent</option></select>
<div id="description" class="text-sm text-gray-500 bg-gray-50 rounded p-3 mb-4"></div><div id="fields" class="space-y-4 mb-4"></div>
<button id="submit" class="w-full text-white rounded px-4 py-3" style="background:var(--of-navy)">Submit Request</button>
<p id="msg" class="text-sm mt-3"></p>
</section>
<section class="lg:col-span-2 of-card p-6"><div class="flex justify-between items-center mb-4"><div><h2 class="of-serif text-xl font-semibold">Office processes</h2><p class="text-sm text-gray-500">Any repeatable process can be turned into an OfficeFlow workflow.</p></div><button id="refresh" class="text-sm" style="color:var(--of-brass)">Refresh</button></div><div id="list" class="space-y-3"></div></section>
</main>
<script src="/dashboard/js/ooes-auth.js"></script><script src="/dashboard/js/workflow-db.js"></script>
<script>
const $=id=>document.getElementById(id); let rowsCache=[];
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function renderFields(){const w=rowsCache.find(x=>x.id===$('workflow').value),d=w?.workflow_definitions||{};$('description').textContent=d.description||'Define the information needed for this process.';$('fields').innerHTML=(d.form_schema||[]).map(f=>{const l='<label class="block text-sm font-medium mb-1">'+esc(f.label||f.key)+(f.required?' *':'')+'</label>';if(f.type==='textarea')return '<div>'+l+'<textarea data-key="'+esc(f.key)+'" rows="4" class="w-full border rounded px-3 py-2" '+(f.required?'required':'')+'></textarea></div>';if(f.type==='select')return '<div>'+l+'<select data-key="'+esc(f.key)+'" class="w-full border rounded px-3 py-2" '+(f.required?'required':'')+'><option value="">Select...</option>'+((f.options||[]).map(o=>'<option>'+esc(o)+'</option>').join(''))+'</select></div>';return '<div>'+l+'<input data-key="'+esc(f.key)+'" type="'+esc(f.type||'text')+'" class="w-full border rounded px-3 py-2" '+(f.required?'required':'')+'></div>';}).join('');} $('workflow').onchange=renderFields; async function load(){try{const rows=await OfficeFlowWorkflow.published(); rowsCache=rows;$('workflow').innerHTML=rows.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.workflow_definitions?.name||'Workflow')+' — v'+esc(x.version_no)+'</option>').join('')||'<option>No published workflows</option>';$('list').innerHTML=rows.map(x=>'<div class="border rounded p-4 flex justify-between"><div><div class="font-semibold">'+esc(x.workflow_definitions?.name||'Workflow')+'</div><div class="text-xs text-gray-500">Version '+esc(x.version_no)+' · Published</div></div><span class="text-xs px-2 py-1 rounded bg-gray-100">Active</span></div>').join('')||'<p class="text-gray-500">No published workflows.</p>';renderFields();}catch(e){$('msg').textContent=e.message;$('msg').className='text-sm mt-3 text-red-600';}}
$('submit').onclick=async()=>{const v=$('workflow').value,t=$('title').value.trim();if(!v||!t){$('msg').textContent='Choose a workflow and enter a title.';return;}try{$('submit').disabled=true;const payload={};let valid=true;document.querySelectorAll('#fields [data-key]').forEach(el=>{payload[el.dataset.key]=el.value.trim();if(el.required&&!el.value.trim())valid=false;});if(!valid){$('msg').textContent='Complete all required fields.';return;}const r=await OfficeFlowWorkflow.submit(v,t,payload,$('priority').value);$('msg').innerHTML='Submitted. <a class="underline" href="requestDetail.html?id='+encodeURIComponent(r.id)+'">Open request</a>';$('msg').className='text-sm mt-3 text-green-600';}catch(e){$('msg').textContent=e.message;$('msg').className='text-sm mt-3 text-red-600';}finally{$('submit').disabled=false;}};
$('refresh').onclick=load;document.addEventListener('DOMContentLoaded',load);
</script></body></html>
