<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OfficeFlow — Workflow Builder</title>
<script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/dashboard/js/config.js"></script><script>var supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);</script>
<link rel="stylesheet" href="css/executive-theme.css"><link rel="stylesheet" href="css/mobile.css">
</head><body class="bg-gray-50">
<header class="of-header px-6 py-4 flex justify-between items-center"><div><div class="of-eyebrow">OfficeFlow</div><h1 class="of-serif text-2xl font-semibold">Workflow Builder</h1></div><a href="index.html" class="text-sm">Dashboard</a></header>
<main class="max-w-4xl mx-auto p-6"><section class="of-card p-6">
<h2 class="of-serif text-xl font-semibold">Create a workflow</h2><p class="text-sm text-gray-500 mt-1 mb-6">Turn an internal process into a controlled approval workflow without code.</p>
<div id="error" class="hidden text-red-600 mb-4"></div><div id="success" class="hidden text-green-700 mb-4"></div>
<label class="block text-sm font-medium mb-1">Workflow name</label><input id="name" maxlength="120" class="w-full border rounded px-3 py-2 mb-6" placeholder="e.g. Payment Request">
<div class="flex justify-between items-center mb-3"><h3 class="font-semibold">Approval steps</h3><button id="add" class="text-sm" style="color:var(--of-brass)">+ Add step</button></div>
<div id="steps" class="space-y-3"></div>
<button id="create" class="mt-6 w-full text-white rounded px-4 py-3" style="background:var(--of-navy)">Create Draft Workflow</button>
</section></main>
<script src="/dashboard/js/ooes-auth.js"></script>
<script>
const $=x=>document.getElementById(x), roles=['employee','officer','manager','administrator','auditor','super_admin'];let n=0;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function addStep(name='',role='manager',sla=24){n++;const d=document.createElement('div');d.className='border rounded-lg p-4';d.dataset.n=n;d.innerHTML='<div class="flex justify-between mb-3"><span class="font-medium">Step '+n+'</span><button class="remove text-xs text-red-600">Remove</button></div><div class="grid md:grid-cols-3 gap-3"><div><label class="text-xs text-gray-500">Step name</label><input class="sname w-full border rounded px-3 py-2" maxlength="120" value="'+esc(name)+'" placeholder="Manager approval"></div><div><label class="text-xs text-gray-500">Approver role</label><select class="srole w-full border rounded px-3 py-2">'+roles.map(r=>'<option '+(r===role?'selected':'')+'>'+r+'</option>').join('')+'</select></div><div><label class="text-xs text-gray-500">SLA hours</label><input type="number" min="0.5" max="720" step="0.5" class="ssla w-full border rounded px-3 py-2" value="'+sla+'"></div></div>';d.querySelector('.remove').onclick=()=>{d.remove();renumber();};$('steps').appendChild(d);}
function renumber(){[...$('steps').children].forEach((d,i)=>d.querySelector('span').textContent='Step '+(i+1));}
async function create(){try{$('error').classList.add('hidden');$('success').classList.add('hidden');const name=$('name').value.trim();const rows=[...$('steps').children].map(d=>({name:d.querySelector('.sname').value.trim(),approver_role:d.querySelector('.srole').value,sla_hours:Number(d.querySelector('.ssla').value)}));if(!name||!rows.length||rows.some(x=>!x.name||!Number.isFinite(x.sla_hours)||x.sla_hours<.5))throw new Error('Enter a workflow name and valid details for every step.');const {data,error}=await supabase.rpc('fn_create_workflow',{p_name:name,p_department_id:null,p_steps:rows});if(error)throw error;const {data:pub,error:pe}=await supabase.rpc('fn_publish_workflow_version',{p_workflow_version_id:data.id});if(pe)throw pe;$('success').textContent='Workflow created and published successfully.';$('success').classList.remove('hidden');$('name').value='';$('steps').innerHTML='';n=0;addStep();}catch(e){$('error').textContent=e.message||'Unable to create workflow.';$('error').classList.remove('hidden');}}
$('add').onclick=()=>addStep();$('create').onclick=create;document.addEventListener('DOMContentLoaded',()=>{if(OOES_AUTH.getRole()!=='administrator'&&OOES_AUTH.getRole()!=='super_admin'){$('error').textContent='Only administrators can use the Workflow Builder.';$('error').classList.remove('hidden');$('create').disabled=true;}addStep('Manager Approval','manager',24);});
</script></body></html>
