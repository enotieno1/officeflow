<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Accept OfficeFlow Invitation</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/dashboard/js/config.js"></script><script>var supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);</script><link rel="stylesheet" href="css/executive-theme.css"><link rel="stylesheet" href="css/mobile.css"></head>
<body class="min-h-screen flex items-center justify-center p-4" style="background:var(--of-navy)">
<main class="w-full max-w-xl"><section class="bg-white rounded-2xl shadow-2xl p-8">
<p class="text-sm font-semibold tracking-wide" style="color:var(--of-brass)">OFFICEFLOW WORKSPACE</p><h1 class="of-serif text-3xl font-semibold text-gray-900 mt-2">Accept your invitation</h1>
<p id="intro" class="text-gray-600 mt-3">Confirming your invitation link…</p>
<form id="acceptForm" class="space-y-4 mt-6" hidden>
<div><label for="password" class="block text-sm font-medium mb-1">Create a password</label><input id="password" type="password" minlength="8" autocomplete="new-password" required class="w-full rounded-lg border border-gray-300 px-4 py-3" placeholder="At least 8 characters"></div>
<div><label for="confirmPassword" class="block text-sm font-medium mb-1">Confirm password</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required class="w-full rounded-lg border border-gray-300 px-4 py-3"></div>
<button id="acceptButton" type="submit" class="w-full rounded-lg px-5 py-3 text-white font-semibold" style="background:var(--of-navy)">Join organization</button>
</form><p id="status" class="text-sm mt-4" role="status" aria-live="polite"></p>
<p class="mt-6 text-sm"><a href="/dashboard/auth.html" class="underline" style="color:var(--of-navy)">Return to sign in</a></p>
</section></main>
<script>
const invitationId=new URLSearchParams(location.search).get('invitation_id');
const form=document.getElementById('acceptForm'),intro=document.getElementById('intro'),statusEl=document.getElementById('status');
function showStatus(text,error=false){statusEl.textContent=text;statusEl.className='text-sm mt-4 '+(error?'text-red-700':'text-gray-600');}
async function prepare(){
 if(!invitationId){intro.textContent='This invitation link is missing its invitation reference. Ask your organization administrator to send a new invitation.';showStatus('Invitation link is incomplete.',true);return;}
 try{
  const {data,error}=await supabase.auth.getSession();if(error)throw error;
  if(!data.session){intro.textContent='Open this page from the invitation email. If the link has expired, ask your administrator to send a new invitation.';showStatus('No active invitation session was found.',true);return;}
  if(!data.session.user.email){throw new Error('The signed-in account has no email address.');}
  intro.textContent='Invitation for '+data.session.user.email+'. Set a password to finish joining the organization.';
  form.hidden=false;showStatus('Your invitation link is valid. Choose a password to continue.');
 }catch(e){intro.textContent='We could not validate this invitation.';showStatus(e.message||'Please reopen the link from your invitation email.',true);}
}
form.addEventListener('submit',async e=>{
 e.preventDefault();const password=document.getElementById('password').value;const confirm=document.getElementById('confirmPassword').value;
 if(password.length<8){showStatus('Use a password of at least 8 characters.',true);return;}if(password!==confirm){showStatus('Passwords do not match.',true);return;}
 const button=document.getElementById('acceptButton');button.disabled=true;button.textContent='Joining…';showStatus('Securing your account and joining the workspace…');
 try{
  const {data:sessionData,error:sessionError}=await supabase.auth.getSession();if(sessionError||!sessionData.session)throw new Error('Your invitation session expired. Reopen the invitation email link.');
  const {error:passwordError}=await supabase.auth.updateUser({password});if(passwordError)throw passwordError;
  const {data:orgId,error}=await supabase.rpc('fn_accept_org_invitation',{p_invitation_id:invitationId});if(error)throw error;if(!orgId)throw new Error('The invitation could not be accepted.');
  showStatus('Invitation accepted. Opening your organization workspace…');setTimeout(()=>location.replace('/dashboard/index.html'),700);
 }catch(err){showStatus(err.message||'Unable to accept invitation. Please contact your organization administrator.',true);}
 finally{button.disabled=false;button.textContent='Join organization';}
});
document.addEventListener('DOMContentLoaded',prepare);
</script></body></html>
