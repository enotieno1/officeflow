<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OfficeFlow — Tasks</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="/dashboard/css/executive-theme.css"><link rel="stylesheet" href="/dashboard/css/mobile.css">
<style>
body{background:#f5f6f8;color:#16213e}.shell{max-width:1180px;margin:auto}.navy{background:#16213e}.brass{color:#a6823d}.panel{background:#fff;border:1px solid #e3e7ee;border-radius:14px;box-shadow:0 4px 18px rgba(22,33,62,.04)}.btn{border-radius:8px;padding:9px 13px;font-size:14px;font-weight:600}.btn-primary{background:#16213e;color:#fff}.btn-secondary{background:#fff;border:1px solid #d6dbe4;color:#344054}.field{width:100%;border:1px solid #d0d5dd;border-radius:8px;padding:10px 12px;background:#fff;color:#16213e}.field:focus{outline:2px solid #a6823d;outline-offset:1px}.modal{display:none;position:fixed;inset:0;z-index:60;background:rgba(16,24,40,.55);padding:18px;overflow:auto}.modal.open{display:grid;place-items:center}.pill{font-size:12px;font-weight:700;padding:4px 8px;border-radius:999px}.task-card{border:1px solid #e4e7ec;border-radius:12px;background:#fff;padding:18px}.muted{color:#667085}
</style>
</head>
<body class="min-h-screen">
<header class="navy text-white"><div class="shell px-5 py-4 flex items-center justify-between gap-4"><a href="/dashboard/index.html" class="text-white no-underline font-bold text-xl">OfficeFlow</a><nav class="flex items-center gap-4 text-sm"><a class="text-white underline" href="/dashboard/index.html">Dashboard</a><a class="text-white underline" href="/dashboard/billing.html">Billing</a><span data-user-name></span><button id="signOut" class="underline">Sign out</button></nav></div></header>
<main class="shell px-5 py-8">
<div class="flex flex-wrap items-end justify-between gap-4 mb-7"><div><p class="brass uppercase tracking-widest text-xs font-bold">Work management</p><h1 class="text-3xl font-bold mt-2">Tasks</h1><p class="muted mt-2">Create, assign, update and complete tasks for your organization.</p></div><div class="flex gap-2"><button id="exportTasks" class="btn btn-secondary">Export CSV</button><button id="newTask" class="btn btn-primary">+ New task</button></div></div>
<div id="notice" class="hidden rounded-lg border p-3 mb-5 text-sm" role="status" aria-live="polite"></div>
<section class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-6">
<div class="panel p-4"><p class="muted text-sm">Pending</p><p id="countPending" class="text-2xl font-bold mt-1">—</p></div>
<div class="panel p-4"><p class="muted text-sm">In progress</p><p id="countProgress" class="text-2xl font-bold mt-1">—</p></div>
<div class="panel p-4"><p class="muted text-sm">Completed</p><p id="countCompleted" class="text-2xl font-bold mt-1">—</p></div>
<div class="panel p-4"><p class="muted text-sm">Overdue</p><p id="countOverdue" class="text-2xl font-bold mt-1">—</p></div>
</section>
<section class="panel p-4 mb-5"><div class="grid grid-cols-1 md:grid-cols-3 gap-3"><input id="searchTasks" class="field" placeholder="Search tasks"><select id="filterStatus" class="field"><option value="">All statuses</option><option value="pending">Pending</option><option value="in_progress">In progress</option><option value="completed">Completed</option><option value="overdue">Overdue</option></select><select id="filterPriority" class="field"><option value="">All priorities</option><option value="high">High</option><option value="medium">Medium</option><option value="low">Low</option></select></div></section>
<div id="loadStatus" class="muted text-sm mb-3" role="status" aria-live="polite">Loading tasks…</div>
<section id="taskList" class="space-y-3"></section>
</main>
<div id="taskModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="panel p-6 w-full max-w-xl"><div class="flex items-start justify-between gap-3 mb-5"><div><p class="brass uppercase tracking-widest text-xs font-bold">Task record</p><h2 id="modalTitle" class="text-xl font-bold mt-1">Create task</h2></div><button id="closeModal" class="btn btn-secondary">Close</button></div>
<form id="taskForm" class="space-y-4"><label class="block text-sm font-semibold">Task title<input id="taskTitle" class="field mt-1" maxlength="200" required></label><label class="block text-sm font-semibold">Description<textarea id="taskDescription" class="field mt-1" rows="4" maxlength="5000"></textarea></label><div class="grid grid-cols-1 md:grid-cols-2 gap-3"><label class="block text-sm font-semibold">Priority<select id="taskPriority" class="field mt-1"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select></label><label class="block text-sm font-semibold">Due date<input id="taskDueDate" type="date" class="field mt-1"></label></div><label class="block text-sm font-semibold">Assign to<select id="taskAssignee" class="field mt-1"><option value="">Unassigned</option></select><span id="assigneeHelp" class="muted text-xs font-normal block mt-1">Managers and administrators can assign tasks to organization members.</span></label><div class="flex justify-end gap-2 pt-2"><button type="button" id="cancelModal" class="btn btn-secondary">Cancel</button><button type="submit" id="saveTask" class="btn btn-primary">Create task</button></div></form></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/dashboard/js/config.js"></script><script src="/dashboard/js/db.js"></script><script src="/dashboard/js/ooes-auth.js"></script>
<script>
(function(){
 const $=id=>document.getElementById(id);
 let tasks=[],members=[],editingId=null;
 const escape=v=>String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
 const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d;};
 const overdue=t=>t.status!=='completed'&&!!t.due_date&&new Date(t.due_date+'T00:00:00')<today();
 function notice(message,type='info'){const el=$('notice');el.textContent=message;el.className='rounded-lg border p-3 mb-5 text-sm '+(type==='error'?'bg-red-50 border-red-200 text-red-800':type==='success'?'bg-green-50 border-green-200 text-green-800':'bg-blue-50 border-blue-200 text-blue-800');}
 function statusText(t){return overdue(t)?'Overdue':String(t.status||'pending').replace('_',' ').replace(/^./,x=>x.toUpperCase());}
 function makeOption(label,value){const o=document.createElement('option');o.value=value;o.textContent=label;return o;}
 async function loadAssignees(){const select=$('taskAssignee'),session=OOES_AUTH.getSession();select.replaceChildren(makeOption('Unassigned',''));if(!session)return;if(['administrator','manager','super_admin'].includes(session.role)){const {data,error}=await supabase.rpc('fn_list_task_assignees');if(error){$('assigneeHelp').textContent='Member list unavailable; tasks can still be saved unassigned.';return;}members=data||[];members.forEach(m=>select.append(makeOption((m.display_name||m.email)+(m.email&&m.display_name!==m.email?' · '+m.email:''),m.user_id)));}else{select.append(makeOption('Me — '+(session.name||session.email),session.id));$('assigneeHelp').textContent='You can assign a task to yourself. Ask a manager to assign tasks to others.';}}
 function render(){
  const q=$('searchTasks').value.trim().toLowerCase(),status=$('filterStatus').value,priority=$('filterPriority').value;
  const rows=tasks.filter(t=>{if(status==='overdue'&&!overdue(t))return false;if(status&&status!=='overdue'&&(t.status||'pending')!==status)return false;if(priority&&t.priority!==priority)return false;return !q||[t.title,t.description,t.assigned_to,t.status,t.priority].some(v=>String(v||'').toLowerCase().includes(q));});
  $('loadStatus').textContent=rows.length+' task'+(rows.length===1?'':'s')+' shown';
  const list=$('taskList');list.replaceChildren();
  if(!rows.length){const empty=document.createElement('div');empty.className='panel p-8 text-center';const h=document.createElement('h2');h.className='font-bold text-lg';h.textContent=tasks.length?'No tasks match these filters':'No tasks yet';const p=document.createElement('p');p.className='muted text-sm mt-2';p.textContent=tasks.length?'Try changing the filters or search term.':'Create your first task to start tracking work in OfficeFlow.';empty.append(h,p);list.append(empty);return;}
  rows.forEach(t=>{
   const card=document.createElement('article');card.className='task-card';
   const top=document.createElement('div');top.className='flex flex-col md:flex-row md:items-start md:justify-between gap-3';
   const left=document.createElement('div');left.className='min-w-0 flex-1';
   const line=document.createElement('div');line.className='flex flex-wrap items-center gap-2';
   const title=document.createElement('h2');title.className='font-bold text-lg break-words';title.textContent=t.title||'(Untitled task)';
   const pr=document.createElement('span');pr.className='pill '+(t.priority==='high'?'bg-red-100 text-red-800':t.priority==='low'?'bg-green-100 text-green-800':'bg-amber-100 text-amber-800');pr.textContent=(t.priority||'medium')+' priority';
   const st=document.createElement('span');st.className='pill '+(overdue(t)?'bg-red-100 text-red-800':t.status==='completed'?'bg-green-100 text-green-800':t.status==='in_progress'?'bg-blue-100 text-blue-800':'bg-slate-100 text-slate-700');st.textContent=statusText(t);
   line.append(title,pr,st);left.append(line);
   const desc=document.createElement('p');desc.className='muted text-sm mt-2 whitespace-pre-wrap';desc.textContent=t.description||'No description provided.';left.append(desc);
   const meta=document.createElement('p');meta.className='muted text-xs mt-3';meta.textContent='Due: '+(t.due_date||'No date')+' · Assigned to: '+(t.assigned_to||'Unassigned');left.append(meta);
   const actions=document.createElement('div');actions.className='flex flex-wrap gap-2';
   const makeButton=(label,cls,handler)=>{const b=document.createElement('button');b.type='button';b.className='btn '+cls;b.textContent=label;b.addEventListener('click',handler);return b;};
   const session=OOES_AUTH.getSession(),isAdmin=['administrator','manager','super_admin'].includes(session?.role),canEdit=isAdmin||t.owner_id===session?.id||t.assigned_to_user_id===session?.id,canDelete=isAdmin||t.owner_id===session?.id;if(canEdit){actions.append(makeButton('Edit','btn-secondary',()=>openEdit(t)),makeButton(t.status==='completed'?'Reopen':t.status==='in_progress'?'Complete':'Start','btn-primary',()=>changeStatus(t)));}if(canDelete)actions.append(makeButton('Delete','btn-secondary',()=>removeTask(t)));
   top.append(left,actions);card.append(top);
   const details=document.createElement('details');details.className='mt-4 border-t pt-3 text-sm muted';const summary=document.createElement('summary');summary.className='cursor-pointer font-semibold';summary.textContent='More details';const body=document.createElement('p');body.className='mt-2';body.textContent='Created '+(t.created_at?new Date(t.created_at).toLocaleString('en-KE'):'date unavailable')+' · Task ID '+t.id;details.append(summary,body);card.append(details);
   list.append(card);
  });
 }
 function updateCounts(){
  $('countPending').textContent=tasks.filter(t=>(t.status||'pending')==='pending'&&!overdue(t)).length;
  $('countProgress').textContent=tasks.filter(t=>t.status==='in_progress').length;
  $('countCompleted').textContent=tasks.filter(t=>t.status==='completed').length;
  $('countOverdue').textContent=tasks.filter(overdue).length;
 }
 async function loadTasks(){
  $('loadStatus').textContent='Loading tasks…';
  try{
   const {data,error}=await supabase.from('tasks').select('id,title,description,status,priority,assigned_to,assigned_to_user_id,due_date,owner_id,organization_id,created_at').order('due_date',{ascending:true});
   if(error)throw error;
   tasks=data||[];updateCounts();render();
  }catch(error){console.error('Tasks load failed',error);$('loadStatus').textContent='Tasks could not be loaded. Refresh or contact your administrator.';notice('Could not load tasks. Please retry.','error');}
 }
 function openNew(){editingId=null;$('taskForm').reset();$('taskPriority').value='medium';$('taskAssignee').disabled=false;$('taskAssignee').value='';$('modalTitle').textContent='Create task';$('saveTask').textContent='Create task';$('taskModal').classList.add('open');$('taskTitle').focus();}
 function openEdit(t){editingId=t.id;const session=OOES_AUTH.getSession(),canManageAssignment=['administrator','manager','super_admin'].includes(session?.role)||t.owner_id===session?.id;$('taskAssignee').disabled=!canManageAssignment;$('taskTitle').value=t.title||'';$('taskDescription').value=t.description||'';$('taskPriority').value=['low','medium','high'].includes(t.priority)?t.priority:'medium';$('taskDueDate').value=t.due_date||'';const select=$('taskAssignee'),assignee=t.assigned_to_user_id;if(assignee&&!Array.from(select.options).some(o=>o.value===assignee))select.append(makeOption(t.assigned_to||'Current assignee',assignee));select.value=assignee||'';$('modalTitle').textContent='Edit task';$('saveTask').textContent='Save changes';$('taskModal').classList.add('open');$('taskTitle').focus();}
 function closeModal(){$('taskModal').classList.remove('open');$('taskAssignee').disabled=false;editingId=null;}
 async function save(event){
  event.preventDefault();
  const session=OOES_AUTH.getSession();if(!session?.organization_id){notice('Your organization session is not ready. Please sign in again.','error');return;}
  const title=$('taskTitle').value.trim();if(!title){notice('Enter a task title.','error');return;}
  const currentTask=editingId!==null?tasks.find(t=>String(t.id)===String(editingId)):null;const payload={title,description:$('taskDescription').value.trim()||null,priority:$('taskPriority').value,due_date:$('taskDueDate').value||null,assigned_to_user_id:$('taskAssignee').disabled?(currentTask?.assigned_to_user_id||null):($('taskAssignee').value||null)};
  const wasEditing=editingId!==null;$('saveTask').disabled=true;
  try{
   const result=wasEditing
    ? await supabase.from('tasks').update(payload).eq('id',editingId).select('id').single()
    : await supabase.from('tasks').insert([{...payload,status:'pending',owner_id:session.id,organization_id:session.organization_id}]).select('id').single();
   if(result.error)throw result.error;
   closeModal();notice(wasEditing?'Task updated.':'Task created.','success');await loadTasks();
  }catch(error){console.error('Task save failed',error);notice('Task was not saved. Check your permissions and retry.','error');}
  finally{$('saveTask').disabled=false;}
 }
 async function changeStatus(t){
  const next=t.status==='completed'?'pending':t.status==='in_progress'?'completed':'in_progress';
  try{const {error}=await supabase.from('tasks').update({status:next}).eq('id',t.id);if(error)throw error;notice('Task status updated.','success');await loadTasks();}
  catch(error){console.error('Task status update failed',error);notice('Task status could not be updated.','error');}
 }
 async function removeTask(t){
  if(!confirm('Delete “'+(t.title||'this task')+'” permanently?'))return;
  try{const {error}=await supabase.from('tasks').delete().eq('id',t.id);if(error)throw error;notice('Task deleted.','success');await loadTasks();}
  catch(error){console.error('Task deletion failed',error);notice('Task could not be deleted. Check your permissions.','error');}
 }
 function exportCsv(){
  const rows=[['Title','Description','Status','Priority','Assigned to','Due date'],...tasks.map(t=>[t.title,t.description,t.status,t.priority,t.assigned_to,t.due_date])];
  const csv=rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='officeflow-tasks.csv';a.click();URL.revokeObjectURL(url);
 }
 document.addEventListener('DOMContentLoaded',async()=>{
  await OOES_AUTH.ready;
  if(!OOES_AUTH.getSession())return;
  $('signOut').addEventListener('click',()=>OOES_AUTH.logout());
  $('newTask').addEventListener('click',openNew);$('closeModal').addEventListener('click',closeModal);$('cancelModal').addEventListener('click',closeModal);
  $('taskForm').addEventListener('submit',save);$('searchTasks').addEventListener('input',render);$('filterStatus').addEventListener('change',render);$('filterPriority').addEventListener('change',render);$('exportTasks').addEventListener('click',exportCsv);
  $('taskModal').addEventListener('click',event=>{if(event.target===$('taskModal'))closeModal();});
  await loadAssignees();await loadTasks();
 });
})();
</script>
</body>
</html>
