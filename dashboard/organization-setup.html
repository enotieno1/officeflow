<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set Up Your Organization | OfficeFlow</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/dashboard/js/config.js"></script>
<script>var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);</script>
<link rel="stylesheet" href="css/executive-theme.css">
<link rel="stylesheet" href="css/mobile.css">
</head>
<body class="min-h-screen flex items-center justify-center p-4" style="background:var(--of-navy)">
<main class="w-full max-w-xl">
  <section class="bg-white rounded-2xl shadow-2xl p-8">
    <div class="mb-7">
      <p class="text-sm font-semibold tracking-wide" style="color:var(--of-brass)">OFFICEFLOW SETUP</p>
      <h1 class="of-serif text-3xl font-semibold text-gray-900 mt-2">Set up your organization</h1>
      <p class="text-gray-600 mt-3">Create your organization workspace. You will become its administrator and can then configure departments, invite your team, and set up workflows.</p>
    </div>
    <form id="orgForm" class="space-y-5">
      <div>
        <label for="orgName" class="block text-sm font-medium text-gray-700 mb-2">Organization name</label>
        <input id="orgName" name="orgName" type="text" minlength="2" maxlength="120" required autocomplete="organization" placeholder="e.g. Acme Limited" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:border-transparent outline-none">
      </div>
      <button id="createButton" type="submit" class="w-full text-white py-3 px-4 rounded-lg font-semibold" style="background:var(--of-navy)">Create workspace</button>
      <p id="message" class="text-sm text-center" role="status" aria-live="polite"></p>
    </form>
    <div class="mt-6 border-t pt-5 text-center">
      <button id="signOutButton" type="button" class="text-sm underline" style="color:var(--of-navy)">Sign out</button>
    </div>
  </section>
</main>
<script src="/dashboard/js/ooes-auth.js"></script>
<script>
(function() {
  var bootstrapOrgId = '00000000-0000-0000-0000-000000000001';
  var form = document.getElementById('orgForm');
  var button = document.getElementById('createButton');
  var message = document.getElementById('message');
  function showMessage(text, isError) {
    message.textContent = text;
    message.className = 'text-sm text-center ' + (isError ? 'text-red-600' : 'text-gray-600');
  }
  document.addEventListener('DOMContentLoaded', async function() {
    await OOES_AUTH.ready;
    var account = OOES_AUTH.getSession();
    if (!account) return;
    if (account.role !== 'employee' || account.organization_id !== bootstrapOrgId) {
      window.location.replace('/dashboard/index.html');
      return;
    }
  });
  form.addEventListener('submit', async function(event) {
    event.preventDefault();
    var orgName = document.getElementById('orgName').value.trim();
    if (orgName.length < 2 || orgName.length > 120) {
      showMessage('Enter an organization name between 2 and 120 characters.', true);
      return;
    }
    button.disabled = true;
    button.textContent = 'Creating workspace…';
    showMessage('Setting up your secure organization workspace. Please wait.', false);
    try {
      var result = await supabase.rpc('fn_create_organization_for_current_user', { p_org_name: orgName });
      if (result.error) {
        showMessage(result.error.message || 'Workspace setup failed. Please try again.', true);
        return;
      }
      showMessage('Workspace created. Opening OfficeFlow…', false);
      await OOES_AUTH._loadProfile((await supabase.auth.getUser()).data.user);
      var nextTarget = new URLSearchParams(window.location.search).get('next');
      var destination = '/dashboard/index.html';
      if (nextTarget && nextTarget.charAt(0) === '/') {
        try {
          var target = new URL(nextTarget, window.location.origin);
          if (target.origin === window.location.origin &&
              target.pathname.startsWith('/dashboard/') &&
              target.pathname !== '/dashboard/auth.html' &&
              target.pathname !== '/dashboard/organization-setup.html') {
            destination = target.pathname + target.search + target.hash;
          }
        } catch (ignore) {}
      }
      setTimeout(function() { window.location.replace(destination); }, 600);
    } catch (error) {
      showMessage('OfficeFlow could not complete workspace setup. Check your connection and try again.', true);
    } finally {
      button.disabled = false;
      button.textContent = 'Create workspace';
    }
  });
  document.getElementById('signOutButton').addEventListener('click', function() {
    OOES_AUTH.logout();
  });
})();
</script>
</body>
</html>
