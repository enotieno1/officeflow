<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OfficeFlow — Security & Audit</title><script src="https://cdn.tailwindcss.com"></script><script src="/dashboard/js/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>var supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);</script><link rel="stylesheet" href="css/executive-theme.css"><link rel="stylesheet" href="css/mobile.css"></head><body class="bg-gray-50"><header class="of-header px-6 py-4 flex justify-between items-center"><div><div class="of-eyebrow">OfficeFlow</div><h1 class="of-serif text-2xl font-semibold">Security & Audit</h1><p class="text-sm text-gray-500 mt-1">Real tenant-scoped security visibility. No simulated threats or fake controls.</p></div><a href="index.html" class="text-sm">Dashboard</a></header><main class="max-w-6xl mx-auto p-6 space-y-6"><div id="error" class="hidden text-red-600"></div><section class="grid grid-cols-2 md:grid-cols-4 gap-4"><div class="of-card p-5"><div class="text-xs text-gray-500">Signed-in role</div><div id="role" class="text-xl font-semibold mt-1">—</div></div><div class="of-card p-5"><div class="text-xs text-gray-500">Audit events</div><div id="events" class="text-xl font-semibold mt-1">—</div></div><div class="of-card p-5"><div class="text-xs text-gray-500">Notifications</div><div id="notifications" class="text-xl font-semibold mt-1">—</div></div><div class="of-card p-5"><div class="text-xs text-gray-500">Tenant isolation</div><div class="text-xl font-semibold mt-1">RLS</div></div></section><section class="of-card p-6"><div class="flex justify-between items-center mb-4"><div><h2 class="of-serif text-xl font-semibold">Recent audit activity</h2><p class="text-sm text-gray-500">Latest events visible to your organization.</p></div><button id="refresh" class="text-sm" style="color:var(--of-brass)">Refresh</button></div><div id="list" class="space-y-3"><p class="text-gray-500">Loading…</p></div></section></main><script src="/dashboard/js/ooes-auth.js"></script><script>const $=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){try{await OOES_AUTH.ready;if(!OOES_AUTH.isLoggedIn())return;const s=OOES_AUTH.getSession();$('role').textContent=s?.role||'—';const [a,n]=await Promise.all([supabase.from('audit_events').select('*').order('created_at',{ascending:false}).limit(25),supabase.from('notifications').select('id').order('created_at',{ascending:false}).limit(100)]);if(a.error)throw a.error;if(n.error)throw n.error;$('events').textContent=a.data?.length||0;$('notifications').textContent=n.data?.length||0;$('list').innerHTML=(a.data||[]).map(x=>'<article class="border rounded-lg p-4"><div class="flex justify-between gap-3"><div class="font-medium">'+esc(x.action||x.event_type||'Audit event')+'</div><div class="text-xs text-gray-400">'+new Date(x.created_at).toLocaleString('en-KE')+'</div></div><div class="text-xs text-gray-500 mt-1">Actor: '+esc(x.actor_id||x.user_id||'system')+'</div><pre class="text-xs bg-gray-50 rounded p-2 mt-2 whitespace-pre-wrap">'+esc(JSON.stringify(x.details||x.metadata||{},null,2))+'</pre></article>').join('')||'<p class="text-gray-500">No audit events found.</p>'}catch(e){$('error').textContent=e.message||'Unable to load security audit data.';$('error').classList.remove('hidden')}}$('refresh').onclick=load;document.addEventListener('DOMContentLoaded',load);</script></body></html>
