<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OfficeFlow — Documents</title><script src="/dashboard/js/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>var supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);</script><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/executive-theme.css"><link rel="stylesheet" href="css/mobile.css"></head><body class="bg-gray-50"><header class="of-header px-6 py-4 flex justify-between items-center"><div><div class="of-eyebrow">OfficeFlow</div><h1 class="of-serif text-2xl font-semibold">Documents</h1><p class="text-sm text-gray-500 mt-1">Organization documents from the live database.</p></div><a href="index.html" class="text-sm">Dashboard</a></header><main class="max-w-6xl mx-auto p-6"><div id="error" class="hidden text-red-600 mb-4"></div><section class="of-card p-6"><div class="flex justify-between items-center mb-5"><div><h2 class="of-serif text-xl font-semibold">Document register</h2><p class="text-sm text-gray-500">This view no longer uses demo/localStorage files.</p></div><button id="refresh" class="text-sm" style="color:var(--of-brass)">Refresh</button></div><div id="list"><p class="text-gray-500">Loading…</p></div></section></main><script src="/dashboard/js/ooes-auth.js"></script><script>const $=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){try{await OOES_AUTH.ready;if(!OOES_AUTH.isLoggedIn())return;const {data,error}=await supabase.from('documents').select('*').order('created_at',{ascending:false}).limit(100);if(error)throw error;const rows=data||[];$('list').innerHTML=rows.length?'<div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-left border-b"><th class="py-3 pr-3">Name</th><th class="py-3 pr-3">Type</th><th class="py-3 pr-3">Folder</th><th class="py-3 pr-3">Uploaded</th></tr></thead><tbody>'+rows.map(x=>'<tr class="border-b"><td class="py-3 pr-3 font-medium">'+esc(x.name||x.file_name||'Document')+'</td><td class="py-3 pr-3">'+esc(x.mime_type||x.type||'—')+'</td><td class="py-3 pr-3">'+esc(x.folder||'—')+'</td><td class="py-3 pr-3">'+esc(x.created_at?new Date(x.created_at).toLocaleString('en-KE'):'—')+'</td></tr>').join('')+'</tbody></table></div>':'<div class="text-center py-12 text-gray-500">No documents have been registered yet.</div>'}catch(e){$('error').textContent=e.message||'Unable to load documents.';$('error').classList.remove('hidden')}}$('refresh').onclick=load;document.addEventListener('DOMContentLoaded',load);</script></body></html>
