<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OfficeFlow — Control Tower</title>
<script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/dashboard/js/config.js"></script><script>var supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);</script>
<link rel="stylesheet" href="css/executive-theme.css"><link rel="stylesheet" href="css/mobile.css">
</head><body class="bg-gray-50">
<header class="of-header px-6 py-4 flex justify-between items-center"><div><div class="of-eyebrow">OfficeFlow</div><h1 class="of-serif text-2xl font-semibold">Control Tower</h1></div><a href="index.html" class="text-sm">Dashboard</a></header>
<main class="max-w-6xl mx-auto p-6"><div id="error" class="hidden text-red-600 mb-4"></div>
<div class="grid grid-cols-2 md:grid-cols-3 xl:grid-cols-6 gap-4 mb-6">
<div class="of-card p-4"><div class="text-xs text-gray-500">Total</div><div id="total" class="text-2xl font-semibold">—</div></div>
<div class="of-card p-4"><div class="text-xs text-gray-500">Pending</div><div id="pending" class="text-2xl font-semibold">—</div></div>
<div class="of-card p-4"><div class="text-xs text-gray-500">Completed</div><div id="completed" class="text-2xl font-semibold">—</div></div>
<div class="of-card p-4"><div class="text-xs text-gray-500">Rejected</div><div id="rejected" class="text-2xl font-semibold">—</div></div>
<div class="of-card p-4"><div class="text-xs text-gray-500">Overdue</div><div id="overdue" class="text-2xl font-semibold">—</div></div>
<div class="of-card p-4"><div class="text-xs text-gray-500">Escalated</div><div id="escalated" class="text-2xl font-semibold">—</div></div>
</div>
<section class="of-card p-6"><h2 class="of-serif text-xl font-semibold">Operational visibility</h2><p class="text-sm text-gray-500 mt-1">A live view of work moving through your organization.</p><button onclick="load()" class="mt-5 text-sm" style="color:var(--of-brass)">Refresh</button></section>
</main>
<script src="/dashboard/js/ooes-auth.js"></script>
<script>
const $=x=>document.getElementById(x);
async function load(){try{await OOES_AUTH.ready;if(!OOES_AUTH.isLoggedIn())return;const {data,error}=await supabase.rpc('fn_control_tower');if(error)throw error;const x=(data||[])[0]||{};['total','pending','completed','rejected','overdue','escalated'].forEach(k=>$(k).textContent=x[k+'_requests']??x[k+'_steps']??0);}catch(e){$('error').textContent=e.message||'Unable to load Control Tower.';$('error').classList.remove('hidden');}}
document.addEventListener('DOMContentLoaded',load);
</script></body></html>
